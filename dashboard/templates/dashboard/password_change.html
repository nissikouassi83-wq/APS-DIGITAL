<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changer le mot de passe – SHA APS Digitale</title>
  <style>
    :root { color-scheme:dark; --fond:#0f172a; --carte:#1e293b; --texte:#e5e7eb; --gris:#94a3b8; --bordure:#334155; --vert:#0a8f3c; --rouge:#fca5a5; }
    * { box-sizing:border-box; }
    body { display:grid; min-height:100vh; margin:0; place-items:center; padding:20px; color:var(--texte); background:radial-gradient(ellipse at top,var(--carte),var(--fond) 68%); font-family:"Segoe UI",system-ui,sans-serif; }
    main { width:min(100%,440px); padding:28px; border:1px solid var(--bordure); border-radius:16px; background:var(--carte); box-shadow:0 20px 55px rgba(0,0,0,.28); }
    h1 { margin:0 0 8px; font-size:21px; }
    .aide { margin:0 0 20px; color:var(--gris); font-size:13px; line-height:1.5; }
    form p { margin:0 0 15px; }
    label { display:block; margin-bottom:6px; font-size:13px; font-weight:650; }
    input[type="password"] { width:100%; min-height:42px; padding:9px 11px; border:1px solid var(--bordure); border-radius:8px; color:var(--texte); background:var(--fond); font:inherit; }
    input:focus { border-color:#22c55e; outline:2px solid rgba(34,197,94,.2); }
    ul.errorlist { margin:0 0 10px; padding:10px 12px 10px 30px; border:1px solid rgba(248,113,113,.35); border-radius:8px; color:var(--rouge); font-size:12px; }
    .actions { display:flex; align-items:center; gap:12px; margin-top:20px; }
    button { min-height:42px; padding:9px 14px; border:0; border-radius:8px; color:#fff; background:var(--vert); font:inherit; font-weight:700; cursor:pointer; }
    a { color:var(--gris); font-size:13px; }
    button:focus-visible,a:focus-visible { outline:2px solid #86efac; outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <h1>Changer le mot de passe</h1>
    <p class="aide">Choisissez un mot de passe personnel et difficile à deviner.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button type="submit">Enregistrer le nouveau mot de passe</button>
        <a href="{% url 'index' %}">Annuler</a>
      </div>
    </form>
  </main>
</body>
</html>
